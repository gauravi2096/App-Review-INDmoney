# Streamlit config for Product Pulse dashboard
# https://docs.streamlit.io/library/advanced-features/configuration

[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F8"
textColor = "#1F2430"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
